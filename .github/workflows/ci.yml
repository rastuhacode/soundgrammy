name: CI
on:
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  TELEGRAM_API_ID: "1"
  TELEGRAM_API_HASH: ci-placeholder
  CARGO_PROFILE_DEV_DEBUG: "0"
jobs:
  desktop:
    name: Native checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang pkg-config libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libasound2-dev libvulkan1 mesa-vulkan-drivers
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - run: cargo xtask check-versions
      - run: cargo xtask check-dependencies
      - run: cargo check --workspace --locked
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test -p xtask --locked
      - name: Test native services and GPUI interactions
        run: cargo test --manifest-path native/Cargo.toml --locked
      - name: Build native desktop binary
        run: cargo build --locked
      - name: Install native packaging tool
        if: runner.os != 'Linux'
        run: cargo install cargo-packager --version 0.11.2 --locked
      - name: Build and verify release installers
        if: runner.os != 'Linux'
        shell: bash
        run: |
          cargo xtask package --target "${{ matrix.target }}"
          bash .github/scripts/stage-desktop-release.sh "${{ matrix.target }}" release-assets
      - name: Verify Windows executable metadata
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = Resolve-Path 'target/x86_64-pc-windows-msvc/release/soundgrammy.exe'
          $metadata = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($binary.Path)
          $version = (Get-Content version.txt -Raw).Trim()
          if ($metadata.ProductName -cne 'SoundGrammy' -or $metadata.ProductVersion -cne $version) {
            throw "Windows executable metadata does not match SoundGrammy $version"
          }
      - name: Save installers for platform acceptance
        if: runner.os != 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: candidate-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
  android:
    name: Android arm64 APK and JVM tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install Android build dependencies
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;29.0.13846066"
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - run: cargo xtask check-versions
      - run: cargo xtask check-dependencies
      - run: cargo xtask android --debug
      - name: Verify debug APK
        run: |
          apk=native/gen/android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$apk"
      - name: Build and verify minified Android APK and run release JVM tests
        run: |
          cargo xtask android
          apk=native/gen/android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$apk"
      - uses: actions/upload-artifact@v6
        with:
          name: SoundGrammy-Android-dev
          path: native/gen/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
