name: Build release

on:
  workflow_call:
    inputs:
      tag:
        description: Existing or new release tag, for example v0.2.0
        required: true
        type: string
      sha:
        description: Exact release commit; defaults to the tag for manual runs
        required: false
        type: string
      repair_cargo_lock:
        description: Repair only the app version stored in Cargo.lock
        required: false
        default: false
        type: boolean
    secrets:
      TELEGRAM_API_ID:
        required: true
      TELEGRAM_API_HASH:
        required: true
      LASTFM_API_KEY:
        required: true
      LASTFM_API_SECRET:
        required: true
      ANDROID_KEY_BASE64:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Existing or new release tag, for example v0.2.0
        required: true
        type: string
      sha:
        description: Exact release commit; leave empty to build the tag
        required: false
        type: string
      repair_cargo_lock:
        description: Repair a stale SoundGrammy version in Cargo.lock before validation
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-build-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || inputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Repair Cargo lockfile version
        if: ${{ inputs.repair_cargo_lock }}
        run: cargo update --manifest-path src-tauri/Cargo.toml --package soundgrammy

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Verify release versions
        run: bun run check:versions
        env:
          EXPECTED_VERSION: ${{ inputs.tag }}

      - name: Verify Last.fm release credentials
        shell: bash
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        run: |
          test -n "$LASTFM_API_KEY" || { echo "LASTFM_API_KEY is required"; exit 1; }
          test -n "$LASTFM_API_SECRET" || { echo "LASTFM_API_SECRET is required"; exit 1; }

      - name: Build Tauri app and upload artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        with:
          projectPath: "."
          tauriScript: bun run tauri
          tagName: ${{ inputs.tag }}
          releaseName: SoundGrammy ${{ inputs.tag }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  android:
    name: Build and upload Android arm64 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || inputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build dependencies
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;29.0.13846066"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.13846066" >> "$GITHUB_ENV"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Repair Cargo lockfile version
        if: ${{ inputs.repair_cargo_lock }}
        run: cargo update --manifest-path src-tauri/Cargo.toml --package soundgrammy

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Verify release versions
        run: bun run check:versions
        env:
          EXPECTED_VERSION: ${{ inputs.tag }}

      - name: Verify release credentials
        shell: bash
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in TELEGRAM_API_ID TELEGRAM_API_HASH LASTFM_API_KEY LASTFM_API_SECRET ANDROID_KEY_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            test -n "${!name}" || { echo "$name is required"; exit 1; }
          done

      - name: Prepare Android signing key
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/android-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/android-release.jks" >> "$GITHUB_ENV"

      - name: Build signed Android APK
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bun run tauri android build --apk --target aarch64 --ci

      - name: Upload Android APK to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          apk="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk"
          test -f "$apk" || { echo "Android release APK is missing: $apk"; exit 1; }
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          cp "$apk" "$RUNNER_TEMP/SoundGrammy-android-arm64.apk"
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/SoundGrammy-android-arm64.apk" --clobber
