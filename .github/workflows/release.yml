name: Build release

on:
  workflow_call:
    inputs:
      tag:
        description: Existing or new release tag, for example v0.2.0
        required: true
        type: string
      sha:
        description: Exact release commit; defaults to the tag for manual runs
        required: false
        type: string
    secrets:
      TELEGRAM_API_ID:
        required: true
      TELEGRAM_API_HASH:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing or new release tag, for example v0.2.0
        required: true
        type: string
      sha:
        description: Exact release commit; leave empty to build the tag
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-build-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || inputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Verify release versions
        run: bun run check:versions
        env:
          EXPECTED_VERSION: ${{ inputs.tag }}

      - name: Build Tauri app and upload artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        with:
          projectPath: "."
          tauriScript: bun run tauri
          tagName: ${{ inputs.tag }}
          releaseName: SoundGrammy ${{ inputs.tag }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
