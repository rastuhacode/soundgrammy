name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_as:
        description: Optional version override, for example 1.0.0
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release_please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Create repository-scoped release bot token
        id: app_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Create or update release pull request
        id: release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.release_as == '' }}
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app_token.outputs.token }}

      - name: Create or update release pull request with version override
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_as != '' }}
        env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
          RELEASE_AS: ${{ inputs.release_as }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ ! "$RELEASE_AS" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid SemVer version: $RELEASE_AS"
            exit 1
          fi

          npx --yes release-please@17.6.1 release-pr \
            --repo-url="$REPOSITORY" \
            --token="$GITHUB_TOKEN" \
            --release-as="$RELEASE_AS"

  build_release:
    needs: release_please
    if: ${{ needs.release_please.outputs.release_created == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release_please.outputs.tag }}
      sha: ${{ needs.release_please.outputs.sha }}
    secrets: inherit
