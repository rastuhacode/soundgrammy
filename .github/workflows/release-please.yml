name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_as:
        description: Optional version override, for example 1.0.0
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release_please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Create or update release pull request
        id: release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.release_as == '' }}
        uses: googleapis/release-please-action@v5

      - name: Create or update release pull request with version override
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_as != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_AS: ${{ inputs.release_as }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ ! "$RELEASE_AS" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid SemVer version: $RELEASE_AS"
            exit 1
          fi

          npx --yes release-please@17.6.1 release-pr \
            --repo-url="$REPOSITORY" \
            --token="$GITHUB_TOKEN" \
            --release-as="$RELEASE_AS"

      # The JSON updater replaces the whole version and cannot retain -develop.
      # Persist the derived version on the release PR, rather than in a build checkout.
      - name: Find release pull request to synchronize
        id: release_pr
        if: ${{ steps.release.outputs.prs_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.release_as != '') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          branch=$(gh pr list --repo "$REPOSITORY" --base main \
            --label 'autorelease: pending' --json headRefName,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository == false and (.headRefName | startswith("release-please--")))][0].headRefName // empty')
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Checkout release pull request
        if: ${{ steps.release_pr.outputs.branch != '' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release_pr.outputs.branch }}

      - name: Setup Bun
        if: ${{ steps.release_pr.outputs.branch != '' }}
        uses: oven-sh/setup-bun@v2

      - name: Synchronize development version in release pull request
        if: ${{ steps.release_pr.outputs.branch != '' }}
        env:
          RELEASE_BRANCH: ${{ steps.release_pr.outputs.branch }}
        run: |
          bun run check:versions --fix
          if git diff --quiet -- src-tauri/tauri.dev.conf.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/tauri.dev.conf.json
          git commit -m 'chore: synchronize development version'
          git push origin "HEAD:$RELEASE_BRANCH"

  build_release:
    needs: release_please
    if: ${{ needs.release_please.outputs.release_created == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release_please.outputs.tag }}
      sha: ${{ needs.release_please.outputs.sha }}
    secrets: inherit
