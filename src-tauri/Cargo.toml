[package]
name = "soundgrammy"
version = "0.1.0"
description = "SoundGrammy — a native desktop player for your Telegram profile music"
authors = ["SoundGrammy"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "soundgrammy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"

# Async runtime
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# Telegram MTProto (ferogram 0.6.4 — pin; 0.x API may still shift)
ferogram = { version = "=0.6.4", default-features = false, features = ["parsers"] }

# Storage
rusqlite = { version = "0.32", features = ["bundled"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto / secure session at rest
aes-gcm = "0.10"
rand = "0.8"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# Utilities
thiserror = "2"
anyhow = "1"
base64 = "0.22"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
lofty = "0.21"
dotenvy = "0.15"

# Local patch: ferogram-mtsender 0.6.4 peels Intermediate/Abridged on ciphertext
# for Obfuscated/PaddedIntermediate (MTProxy dd). Decrypt newly-read bytes first.
[patch.crates-io]
ferogram-mtsender = { path = "vendor/ferogram-mtsender" }
