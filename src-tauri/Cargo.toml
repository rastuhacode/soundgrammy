[package]
name = "soundgrammy"
version = "0.1.1"
description = "SoundGrammy — a native desktop player for your Telegram profile music"
license = "GPL-3.0-only"
authors = ["SoundGrammy"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "soundgrammy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Opt-in only: release builds with this feature expose the WebView inspector.
# Do not enable it for public/App Store artifacts.
release-devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
dotenvy = "0.15"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

# Async runtime
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# Telegram MTProto
ferogram = { version = "=0.6.5", default-features = false, features = ["parsers"] }

# Storage
rusqlite = { version = "0.32", features = ["bundled"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto / secure session at rest
aes-gcm = "0.10"
rand = "0.8"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# Utilities
thiserror = "2"
anyhow = "1"
base64 = "0.22"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
lofty = "0.21"
dotenvy = "0.15"
rustfft = "6.4"
ruopus = "0.1.2"
symphonia = { version = "0.6", default-features = false, features = ["aac", "alac", "flac", "isomp4", "mkv", "ogg", "pcm", "vorbis", "wav", "mpa"] }
