[package]
name = "soundgrammy"
version = "1.1.0"
description = "SoundGrammy — a native desktop player for your Telegram profile music"
license = "GPL-3.0-only"
authors = ["SoundGrammy"]
edition = "2021"
rust-version = "1.97"

[lib]
name = "soundgrammy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Opt-in only: release builds with this feature expose the WebView inspector.
# Do not enable it for public/App Store artifacts.
release-devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
dotenvy = "0.15"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
keepawake = "=0.6.1"

# Async runtime
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
async-trait = "0.1"

# Telegram MTProto
ferogram = { version = "=0.6.5", default-features = false, features = ["parsers"] }

# Storage
rusqlite = { version = "0.40", features = ["bundled"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls"] }

# Crypto / secure session at rest
aes-gcm = "0.11"
keyring = "4"

# Utilities
thiserror = "2"
anyhow = "1"
base64 = "0.23"
hex = "0.4"
md5 = "0.8"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
lofty = "0.25"
dotenvy = "0.15"
rustfft = "6.4"
ruopus = "0.1.2"
symphonia = { version = "0.6", default-features = false, features = ["aac", "alac", "flac", "isomp4", "mkv", "ogg", "pcm", "vorbis", "wav", "mpa"] }
